name: 'my_project'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  my_project:
    raw_01:
      best_practice:
        +materialized: view
        +database: "{{ 'PRD_02_HIST_DB' if target.name == 'prd' else ('TEST_02_HIST_DB' if target.name == 'test' else 'DEV_02_HIST_DB') }}"
        +schema: STAGING
      better_impact:
        +materialized: view
        +database: "{{ 'PRD_02_HIST_DB' if target.name == 'prd' else ('TEST_02_HIST_DB' if target.name == 'test' else 'DEV_02_HIST_DB') }}"
        +schema: STAGING

snapshots:
  my_project:
    hist_02:
      +target_database: "{{ 'PRD_02_HIST_DB' if target.name == 'prd' else ('TEST_02_HIST_DB' if target.name == 'test' else 'DEV_02_HIST_DB') }}"
      best_practice:
        +target_schema: BEST_PRACTICE
      better_impact:
        +target_schema: BETTER_IMPACT