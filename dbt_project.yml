name: 'my_project'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  my_project:
    staging:
      +materialized: view
      +database: "{{ 'PRD_02_HIST_DB' if target.name == 'prd' else ('TEST_02_HIST_DB' if target.name == 'test' else 'DEV_02_HIST_DB') }}"
      +schema: STAGING

snapshots:
  my_project:
    +target_database: "{{ 'PRD_02_HIST_DB' if target.name == 'prd' else ('TEST_02_HIST_DB' if target.name == 'test' else 'DEV_02_HIST_DB') }}"