version: 2

sources:
  - name: raw_best_practise
    database: "{{ 'PRD_01_RAW_DB' if target.name == 'prd' else ('TEST_01_RAW_DB' if target.name == 'test' else 'DEV_01_RAW_DB') }}"
    schema: BEST_PRACTICE
    tables:
      - name: BPS_SEARCH_RESULT
        description: "Raw patient search result data from Best Practice system"
        columns:
          - name: INTERNALID
            description: "Unique identifier for each patient record"
          - name: SURNAME
            description: "Patient surname"
          - name: FIRSTNAME
            description: "Patient first name"
          - name: MIDDLENAME
            description: "Patient middle name"
          - name: PREFERREDNAME
            description: "Patient preferred name"
          - name: TITLE
            description: "Patient title e.g. mr, mrs, dr"
          - name: ADDRESS1
            description: "Primary address line"
          - name: ADDRESS2
            description: "Secondary address line"
          - name: CITY
            description: "City of residence"
          - name: POSTCODE
            description: "Australian postcode"
          - name: FULLADDRESS
            description: "Full concatenated address"
          - name: DOB
            description: "Date of birth in DD/MM/YYYY format"
          - name: AGE
            description: "Patient age"
          - name: SEX
            description: "Patient sex"
          - name: MEDICARENO
            description: "Medicare card number"
          - name: MEDICARELINENO
            description: "Medicare line number"
          - name: MEDICAREEXPIRY
            description: "Medicare card expiry in MM/YYYY format"
          - name: RECORDNO
            description: "Patient record number"
          - name: PENSIONNO
            description: "Pension card number"
          - name: DVANO
            description: "DVA card number"
          - name: HOMEPHONE
            description: "Home phone number"
          - name: WORKPHONE
            description: "Work phone number"
          - name: MOBILEPHONE
            description: "Mobile phone number"
          - name: EMAIL
            description: "Patient email address"

  - name: raw_better_impact
    database: "{{ 'PRD_01_RAW_DB' if target.name == 'prd' else ('TEST_01_RAW_DB' if target.name == 'test' else 'DEV_01_RAW_DB') }}"
    schema: BETTER_IMPACT
    tables:
      - name: PIVOTED_FEEDBACK_EXPORT
        description: "Raw volunteer activity and feedback data from Better Impact system"
        columns:
          - name: DATEVOLUNTEERED
            description: "Date the volunteer activity took place"
          - name: HOURSWORKED
            description: "Number of hours worked including decimals"
          - name: ACTIVITYCATEGORYNAME
            description: "Category of the volunteer activity"
          - name: ACTIVITYNAME
            description: "Name of the specific activity"
          - name: DATABASEUSERID
            description: "Unique identifier for the volunteer"
          - name: FIRSTNAME
            description: "Volunteer first name"
          - name: LASTNAME
            description: "Volunteer last name"
          - name: USERNAME
            description: "Volunteer username"
          - name: ACTIVITYREPORTGROUPNAME
            description: "Grouping name for activity reports"
          - name: FF - Client concerns
            description: "Freeform field - client concerns"
          - name: FF - Client Concerns - 1
            description: "Freeform field - client concerns overflow"
          - name: FF - Good news stories
            description: "Freeform field - good news stories"
          - name: FF - Good news stories - 1
            description: "Freeform field - good news stories overflow"
          - name: FF - If no visits were made please indicate reason
            description: "Freeform field - reason for no visits"
          - name: FF - KMs
            description: "Freeform field - kilometres travelled"
          - name: FF - Match end reason
            description: "Freeform field - reason match ended"
          - name: FF - Name of resident
            description: "Freeform field - name of resident visited"
          - name: FF - No of visits
            description: "Freeform field - number of visits"
          - name: FF - Type of visit
            description: "Freeform field - type of visit made"

      - name: PROFILE_EXPORT
        description: "Raw volunteer profile data from Better Impact system"
        columns:
          - name: DATABASEUSERID
            description: "Unique identifier for the volunteer"
          - name: FIRSTNAME
            description: "Volunteer first name"
          - name: LASTNAME
            description: "Volunteer last name"
          - name: LEGALFIRSTNAME
            description: "Volunteer legal first name"
          - name: MIDDLENAME
            description: "Volunteer middle name"
          - name: SALUTATION
            description: "Volunteer salutation"
          - name: SUFFIX
            description: "Volunteer name suffix"
          - name: POSTALCODE
            description: "Volunteer postal code"
          - name: EMAILADDRESS
            description: "Volunteer email address"
          - name: USERNAME
            description: "Volunteer username"
          - name: BIRTHDAY
            description: "Volunteer date of birth"
          - name: AGE
            description: "Volunteer age"
          - name: CLIENTSTATUS
            description: "Current status of the volunteer client"
          - name: DATEOFLASTCLIENTSTATUSCHANGE
            description: "Date the client status last changed"
          - name: CLIENTDATEJOINED
            description: "Date the client joined"
          - name: YEARSSINCECLIENTDATEJOINED
            description: "Years since the client joined"