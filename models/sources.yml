      - name: CT_MARITAL
        description: "Reference table of marital statuses from TrakCare system"
      - name: CT_NATION
        description: "Reference table of nationalities from TrakCare system"
      - name: CT_OCCUPATION
        description: "Reference table of occupations from TrakCare system"
      - name: CT_REGION
        description: "Reference table of regions from TrakCare system"
      - name: CT_RELIGION
        description: "Reference table of religions from TrakCare system"
      - name: CT_SEX
        description: "Reference table of sex codes from TrakCare system"
      - name: CT_SOCIALSTATUS
