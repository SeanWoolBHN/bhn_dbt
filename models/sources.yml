      - name: PAC_COMMUNICATIONNEEDS
        description: "Reference table of communication needs from TrakCare system"
      - name: PAC_CONCESSIONCARDTYPE
        description: "Reference table of concession card types from TrakCare system"
      - name: PAC_DEPENDENTCHILDREN
        description: "Reference table of dependent children categories from TrakCare system"
      - name: PAC_EMPLOYMENTSTATUS
        description: "Reference table of employment statuses from TrakCare system"
      - name: PAC_INDIGSTATUS
        description: "Reference table of indigenous statuses from TrakCare system"
      - name: PAC_LIVINGARRANGEMENT
        description: "Reference table of living arrangements from TrakCare system"
      - name: PAC_PENSIONTYPE
        description: "Reference table of pension types from TrakCare system"
      - name: PAC_PREFERREDLANGUAGE
