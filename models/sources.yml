version: 2

sources:
  - name: raw_best_practice
    database: DEV_01_RAW_DB
    schema: BEST_PRACTICE
    tables:
      - name: BPS_SEARCH_RESULT
        description: "Raw patient search result data from Best Practice system"

  - name: raw_titanium
    database: DEV_01_RAW_DB
    schema: TITANIUM
    tables:
      - name: PATIENT_DETAIL_REPORT
        description: "Raw patient detail data from Titanium system"
      - name: PROVIDER_OUTPUT_SUMMARY
        description: "Raw provider output summary FCT data from Titanium system"
      - name: APPOINTMENT_DETAIL_REPORT
        description: "Raw appointment detail report FCT data from Titanium system loaded via Airbyte"

  - name: raw_echidna
    database: DEV_01_RAW_DB
    schema: ECHIDNA
    tables:
      - name: ECHIDNA_CLIENTS
        description: "Raw client data from Echidna system"
      - name: NDIS_CLIENT_HOURS
        description: "Raw NDIS client hours FCT data from Echidna system loaded via Airbyte"

  - name: raw_trips
    database: DEV_01_RAW_DB
    schema: TRIPS
    tables:
      - name: TRIPS_CLIENTS
        description: "Raw client data from TRIPS system"
      - name: SERVICE_EVENT_EXPORT
        description: "Raw service event FCT data from TRIPS system loaded via Airbyte"

  - name: raw_e_tools
    database: DEV_01_RAW_DB
    schema: E_TOOLS
    tables:
      - name: CUSTOMER_LIST
        description: "Raw customer list data from E-Tools system"
      - name: PROVIDER_STATEMENT
        description: "Raw provider list data from E-Tools system"

  - name: raw_micropay
    database: DEV_01_RAW_DB
    schema: MICROPAY
    tables:
      - name: EMPLOYEE_DETAILS
        description: "Raw employee details from Micropay payroll system"
      - name: EMPLOYEE_LEAVE
        description: "Raw employee leave FCT data from Micropay payroll system"

  - name: raw_better_impact
    database: DEV_01_RAW_DB
    schema: BETTER_IMPACT
    tables:
      - name: PROFILE_EXPORT
        description: "Raw volunteer profile data from Better Impact system"
      - name: VOLUNTEER_INFORMATION
        description: "Raw volunteer information data from Better Impact system"
      - name: PIVOTED_FEEDBACK_REPORT
        description: "Raw volunteer feedback FCT data from Better Impact system"

  - name: raw_supportability
    database: DEV_01_RAW_DB
    schema: SUPPORTABILITY
    tables:
      - name: CLIENT_LIST_INC_PERSONAL_CONTACTS
        description: "Raw client and personal contact list from Supportability system"
      - name: ACTIVITY_REPORT
        description: "Raw activity report FCT data from Supportability system"
      - name: ALLOCATIONS_REPORT
        description: "Raw allocations report FCT data from Supportability system loaded via Airbyte"

  - name: raw_gh_connect
    database: DEV_01_RAW_DB
    schema: GH_CONNECT
    tables:
      - name: TIMESHEETS
        description: "Raw timesheet FCT data from GH Connect system loaded via Airbyte"

  - name: raw_connx
    database: DEV_01_RAW_DB
    schema: CONNX
    tables:
      - name: EMPLOYEE_DATA
        description: "Raw employee data from CONNX system"
      - name: EMPLOYEE_DEMOGRAPHICS
        description: "Raw employee demographics from CONNX system"
      - name: LICENCE_REGISTRATION
        description: "Raw licence registration data from CONNX system"
    
  - name: raw_trakcare
    database: DEV_01_RAW_DB
    schema: TRAKCARE
    tables:
